[project]
name = "baseline-api"
version = "0.1.0"
description = "BaseLine backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-first-party = ["app"]
